# resource_index.yaml — the curated subset of the vendored lexical
# resources actually cited by the rule pack (docx §6-9).
#
# v1 pins resource versions and curates only the classes/rolesets the
# rule pack references. Full flattening of VerbNet 3.3 / Unified PropBank
# / FrameNet 1.7 / SemLink 2.0 into complete lookup tables is a build
# step (scripts/flatten_resources.py) that emits this index; until then
# the compiler refuses to cite anything not listed here (compile check).

verbnet:
  version: "3.3"
  classes:
    build-26.1: {thematic_roles: [Agent, Theme, Material], members: [build, make, construct]}
    create-26.4: {thematic_roles: [Agent, Theme], members: [create, found, establish, launch, form]}
    use-105.1: {thematic_roles: [Agent, Theme, Instrument], members: [use, apply, leverage, adopt]}
    obtain-13.5.2: {thematic_roles: [Agent, Theme, Source], members: [acquire, obtain, buy]}
    exist-47.1: {thematic_roles: [Theme, Location], members: [exist, live, remain]}
    turn-26.6.1: {thematic_roles: [Agent, Theme, Result], members: [turn, convert, transform]}
    correspond-36.1.1: {thematic_roles: [Theme, Theme], members: [correspond, match, resemble]}

propbank:
  version: "unified-2020"
  rolesets:
    create.01: {arg0: creator, arg1: created thing}
    build.01: {arg0: builder, arg1: built thing}
    make.01: {arg0: maker, arg1: made thing}
    establish.01: {arg0: establisher, arg1: established thing}
    establish.01: {arg0: establisher, arg1: established thing}
    develop.02: {arg0: developer, arg1: developed thing}
    employ.01: {arg0: employer, arg1: employee}
    serve.02: {arg0: server, arg1: role}
    head.01: {arg0: head, arg1: organization}
    lead.02: {arg0: leader, arg1: led thing}

    own.01: {arg0: owner, arg1: owned thing}
    acquire.01: {arg0: buyer, arg1: acquired thing}
    use.01: {arg0: user, arg1: instrument}
    apply.01: {arg0: applier, arg1: applied thing}
    adopt.01: {arg0: adopter, arg1: adopted thing}
    implement.01: {arg0: implementer, arg1: implemented thing}
    cause.01: {arg0: cause, arg1: effect}
    enable.01: {arg0: enabler, arg1: enabled process}
    influence.01: {arg0: influencer, arg1: influenced thing}
    depend.01: {arg0: dependent, arg1: requirement}
    become.01: {arg0: theme, arg1: result}
    convert.01: {arg0: agent, arg1: theme, arg2: result}
    derive.01: {arg0: derived thing, arg1: source}
    resemble.01: {arg0: theme, arg1: theme}

framenet:
  version: "1.7"
  frames:
    Creating: {core: [Creator, Created_entity]}
    Intentionally_create: {core: [Creator, Created_entity]}

    Employing: {core: [Employer, Employee]}
    Leadership: {core: [Leader, Activity]}
    Membership: {core: [Member, Group]}
    Possession: {core: [Owner, Possession]}
    Getting: {core: [Recipient, Theme]}
    Using: {core: [Agent, Instrument]}
    Execution: {core: [Executor, Task]}
    Causation: {core: [Cause, Effect]}
    Undergo_change: {core: [Entity, Final_state]}
    Similarity: {core: [Entities]}
    Part_whole: {core: [Part, Whole]}

semlink:
  version: "2.0"
  coverage: "partial — used only as vetted compile-time data (docx §9)"
