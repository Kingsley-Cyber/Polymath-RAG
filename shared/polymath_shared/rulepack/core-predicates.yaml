# core-predicates.yaml — the curated, versionable semantic rule base.
#
# The compiler (compiler.py) compiles this file into a decision DAG at
# build time. Runtime is pure dict lookup: no parsing, no rule-engine
# agenda. Every Decision carries the rule id + resource versions it used.
#
# Schema (docx §15). Compile-time checks fail the build when:
#   - a predicate lacks a signature, evidence class, or trigger set;
#   - an inverse is not bidirectionally consistent;
#   - two predicates could map the same (evidence_class, roleset,
#     signature) tuple to different predicates;
#   - a cited VerbNet class / PropBank roleset is not declared below.

rule_pack:
  id: core-predicates
  version: 1.0.0
  resource_versions:
    verbnet: "3.3"            # vendored at build time
    propbank: "unified-2020"
    framenet: "1.7"
    semlink: "2.0"
  tiers:
    tier0: universal structural
    tier1: universal semantic

# The 12-type core backbone (docx §3.2).
core_types:
  - Person
  - Organization
  - Location
  - Product
  - Technology
  - Concept
  - Method
  - Event
  - Document
  - Process
  - Measurement
  - TimeReference

# The 18-class evidence inventory (docx §4.2). Pass-2 GLiNER labels are
# descriptive natural-language prompts; the key here is the class id.
evidence_classes:
  creation: "a phrase indicating that someone created, founded, established, launched, or started something"
  employment_membership: "a phrase indicating that someone works for, joined, or is a member of an organization"
  ownership_control: "a phrase indicating ownership, acquisition, or control of a company or product"
  leadership_governance: "a phrase indicating that someone leads, heads, chairs, directs, or manages something"
  composition: "a phrase indicating that something is part of, consists of, contains, or includes something"
  causation: "a phrase indicating that something causes, leads to, results in, drives, or triggers something"
  usage_application: "a phrase indicating that something uses, applies, leverages, or runs on something"
  location: "a phrase indicating where something is located, based, or headquartered"
  temporal: "a phrase indicating when something happened, started, or ended"
  comparison: "a phrase comparing two things: faster than, unlike, similar to, versus"
  measurement: "a phrase indicating a measurement, score, rating, or accuracy figure"
  association: "a phrase indicating a loose association, relation, or link between things"
  dependency: "a phrase indicating that something depends on, requires, or needs something"
  reference_attribution: "a phrase indicating that someone said, reported, cited, or claimed something"
  transformation: "a phrase indicating that something converts, becomes, or maps into something"
  classification: "a phrase indicating that something is a kind, type, or instance of something"
  influence_affect: "a phrase indicating that something influences, affects, modulates, or shapes something"
  communication_expression: "a phrase indicating that something expresses, indicates, signals, or conveys something"

# Lexical trigger tables are declared per predicate (below) and compiled
# flat. VerbNet classes and PropBank rolesets cited here must exist in the
# vendored resource versions (docx §15 compile check).

predicates:
  # ── Tier 0: universal structural (docx §5.2) ────────────────────────

  - id: is_a
    tier: 0
    definition: "Subject is a subtype or kind of object."
    signatures:
      - {subject_core: [Concept, Technology, Method, Product, Process], object_core: [Concept]}
    evidence:
      classes: [classification]
      verbs: [be, represent, constitute]
      multiword: ["is a", "is a type of", "is a kind of", "type of", "kind of", "categorized as", "known as"]
    direction: {canonical: sub_to_super, inverse: has_subclass, symmetry: asymmetric, transitivity: "true"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: medium}
    examples:
      - "Metacognition is a type of cognition."
      - "Kubernetes is a container orchestration system."

  - id: instance_of
    tier: 0
    definition: "Subject is an instance of a class or category."
    signatures:
      - {subject_core: [Person, Organization, Location, Product, Technology, Document, Event, Method], object_core: [Concept, Organization]}
    evidence:
      classes: [classification]
      verbs: [be]
      multiword: ["an instance of", "an example of", "a member of the class"]
    direction: {canonical: instance_to_class, inverse: has_instance, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: medium}
    examples:
      - "Gmail is an example of a webmail product."

  - id: part_of
    tier: 0
    definition: "Subject is a component, part, or member of object."
    signatures:
      - {subject_core: [Concept, Product, Technology, Process, Organization], object_core: [Concept, Product, Technology, Organization]}
    evidence:
      classes: [composition]
      verbs: [contain, comprise, consist, include, compose, constitute]
      nouns: [part, component, member, element, section]
      multiword: ["part of", "component of", "member of", "consists of", "comprised of", "made up of"]
      negative_triggers: [own, acquire]
    direction: {canonical: part_to_whole, inverse: contains, symmetry: asymmetric, transitivity: transitive_guarded}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: medium}
    examples:
      - "The GPU is a component of the workstation."

  - id: located_in
    tier: 0
    definition: "Subject is physically located in object."
    signatures:
      - {subject_core: [Organization, Location, Product, Document, Event], object_core: [Location]}
    evidence:
      classes: [location]
      verbs: [locate, base, situate]
      multiword: ["located in", "based in", "headquartered in", "situated in", "operates in", "has offices in"]
      verbnet_classes: [exist-47.1]
    direction: {canonical: entity_to_place, inverse: location_of, symmetry: asymmetric, transitivity: "true"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: medium}
    examples:
      - "Acme is headquartered in Berlin."

  - id: alias_of
    tier: 0
    definition: "Subject and object denote the same entity under different names."
    signatures:
      - {subject_core: [Person, Organization, Product, Technology, Concept, Method], object_core: [Person, Organization, Product, Technology, Concept, Method]}
    evidence:
      classes: [classification, reference_attribution]
      multiword: ["also known as", "aka", "formerly known as", "renamed", "goes by"]
    direction: {canonical: surface_to_canonical, inverse: alias_of, symmetry: symmetric, transitivity: "true"}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, question: reject}
    graph: {traversal_weight: low}
    examples:
      - "Polymath, also known as the RAG workbench."

  - id: occurred_at
    tier: 0
    definition: "Event happened at a time."
    signatures:
      - {subject_core: [Event], object_core: [TimeReference]}
    evidence:
      classes: [temporal]
      verbs: [occur, happen, hold]
      multiword: ["took place in", "happened in", "was held in", "occurred in"]
    direction: {canonical: event_to_time, inverse: null, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: medium}
    examples:
      - "Black Hat 2024 was held in Las Vegas."

  - id: stated_in
    tier: 0
    definition: "A claim is stated in a document."
    signatures:
      - {subject_core: [Concept, Product, Technology, Method], object_core: [Document]}
    evidence:
      classes: [reference_attribution]
      verbs: [state, cite, document, describe, report]
      multiword: ["stated in", "described in", "documented in", "cited in", "per", "according to"]
    direction: {canonical: content_to_document, inverse: states, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, question: reject}
    graph: {traversal_weight: low}
    examples:
      - "The protocol is described in ISO 27001."

  - id: measured_by
    tier: 0
    definition: "Subject's magnitude is expressed by a measurement."
    signatures:
      - {subject_core: [Process, Concept, Product, Technology], object_core: [Measurement]}
    evidence:
      classes: [measurement]
      verbs: [measure, score, rate, quantify, record]
      multiword: ["measured at", "measured by", "scored", "rated at", "accuracy of"]
    direction: {canonical: entity_to_measurement, inverse: measures, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: medium}
    examples:
      - "The encoder reached 92% accuracy."

  # ── Tier 1: universal semantic (docx §5.3) ──────────────────────────

  - id: created
    tier: 1
    definition: "Agent brings a product, artifact, or concept into existence."
    signatures:
      - {subject_core: [Person, Organization], object_core: [Product, Concept, Method]}
    evidence:
      classes: [creation]
      verbs: [create, make, build, design, write, produce]
      nouns: [creation, author]
      verbnet_classes: [build-26.1, create-26.4]
      propbank_rolesets: [create.01, build.01, make.01]
      framenet_frames: [Creating, Intentionally_create]
      negative_triggers: [found, establish, launch]
    direction: {canonical: agent_to_patient, inverse: created_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "John created the pipeline."
      - "The pipeline was created by John."

  - id: founded
    tier: 1
    definition: "Agent establishes an organization or institution."
    signatures:
      - {subject_core: [Person, Organization], object_core: [Organization]}
      - {subject_core: [Person, Organization], object_core: [Event]}
    evidence:
      classes: [creation]
      verbs: [found, establish, launch, incorporate, charter, form, start]
      nouns: [founding, establishment, formation]
      multiword: ["set up"]
      verbnet_classes: [create-26.4, build-26.1]
      propbank_rolesets: [found.01, establish.01]
      framenet_frames: [Creating, Intentionally_create]
      negative_triggers: [join, acquire, merge]
      ambiguous_triggers: [start, launch]
    direction: {canonical: agent_to_patient, inverse: founded_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "John founded Acme in 2012."
      - "Acme was founded by John."

  - id: developed
    tier: 1
    definition: "Agent develops a technology, method, or product."
    signatures:
      - {subject_core: [Person, Organization], object_core: [Technology, Method, Product]}
    evidence:
      classes: [creation]
      verbs: [develop, engineer, implement, code, prototype]
      nouns: [development, implementation]
      verbnet_classes: [build-26.1]
      propbank_rolesets: [develop.02]
      framenet_frames: [Creating, Invention]
      negative_triggers: [found, establish]
    direction: {canonical: agent_to_patient, inverse: developed_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "Nous Research developed Hermes."

  - id: employs
    tier: 1
    definition: "Organization employs a person."
    signatures:
      - {subject_core: [Organization], object_core: [Person]}
    evidence:
      classes: [employment_membership]
      verbs: [employ, hire, recruit, retain]
      nouns: [employer]
      propbank_rolesets: [employ.01]
      framenet_frames: [Employing]
      negative_triggers: [join, work]
    direction: {canonical: org_to_person, inverse: works_for, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "Acme hired John."
      - "John was hired by Acme."

  - id: has_role
    tier: 1
    definition: "Person holds a role in an organization."
    signatures:
      - {subject_core: [Person], object_core: [Organization]}
    evidence:
      classes: [leadership_governance, employment_membership]
      verbs: [lead, head, chair, direct, manage, serve]
      nouns: [ceo, cto, founder, director, manager, president, engineer, lead, head]
      multiword: ["CEO of", "CTO of", "works for", "serves as", "is the head of", "runs the"]
      propbank_rolesets: [serve.02, head.01]
      framenet_frames: [Leadership]
      negative_triggers: [hire, employ]
    direction: {canonical: person_to_org, inverse: role_held_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "John is the CEO of Acme."

  - id: leads
    tier: 1
    definition: "Person leads an organization, event, or process."
    signatures:
      - {subject_core: [Person], object_core: [Organization, Event, Process]}
    evidence:
      classes: [leadership_governance]
      verbs: [lead, head, direct, manage, run, chair, spearhead]
      propbank_rolesets: [lead.02]
      framenet_frames: [Leadership]
    direction: {canonical: person_to_led, inverse: led_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "John leads the research team."

  - id: member_of
    tier: 1
    definition: "Person or organization is a member of an organization."
    signatures:
      - {subject_core: [Person, Organization], object_core: [Organization]}
    evidence:
      classes: [employment_membership]
      verbs: [join, belong]
      nouns: [member]
      multiword: ["member of", "joined"]
      propbank_rolesets: [member.01]
      framenet_frames: [Membership]
    direction: {canonical: member_to_group, inverse: has_member, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "Alice and Bob joined Acme."

  - id: owns
    tier: 1
    definition: "Owner possesses an organization or product."
    signatures:
      - {subject_core: [Person, Organization], object_core: [Organization, Product]}
    evidence:
      classes: [ownership_control]
      verbs: [own, possess, hold, control]
      nouns: [owner, proprietor]
      propbank_rolesets: [own.01]
      framenet_frames: [Possession]
      negative_triggers: [acquire]
    direction: {canonical: owner_to_owned, inverse: owned_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "King owns the Mac Studio."

  - id: acquired
    tier: 1
    definition: "Buyer acquires an organization or product."
    signatures:
      - {subject_core: [Organization, Person], object_core: [Organization, Product]}
    evidence:
      classes: [ownership_control]
      verbs: [acquire, buy, purchase, absorb]
      nouns: [acquisition, takeover]
      verbnet_classes: [obtain-13.5.2]
      propbank_rolesets: [acquire.01]
      framenet_frames: [Getting]
    direction: {canonical: buyer_to_acquired, inverse: acquired_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "Acme acquired Beta."

  - id: subsidiary_of
    tier: 1
    definition: "Organization is a subsidiary of another organization."
    signatures:
      - {subject_core: [Organization], object_core: [Organization]}
    evidence:
      classes: [ownership_control]
      nouns: [subsidiary, division, branch]
      multiword: ["subsidiary of", "a division of"]
      framenet_frames: [Part_whole]
    direction: {canonical: child_to_parent, inverse: parent_of, symmetry: asymmetric, transitivity: transitive_guarded}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "Beta is a subsidiary of Acme."

  - id: uses
    tier: 1
    definition: "Agent or process applies a technology, method, or resource instrumentally."
    signatures:
      - {subject_core: [Person, Organization, Method, Process, Product], object_core: [Technology, Method, Product]}
    evidence:
      classes: [usage_application]
      verbs: [use, apply, leverage, adopt, employ, utilize, run]
      nouns: [use, usage, application, adoption]
      multiword: ["built with", "built on", "run on", "based on", "powered by"]
      verbnet_classes: [use-105]
      propbank_rolesets: [use.01, apply.01, adopt.01]
      framenet_frames: [Using]
    direction: {canonical: agent_to_instrument, inverse: used_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "The pipeline uses a bi-encoder."
      - "Acme runs on Kubernetes."

  - id: implemented_with
    tier: 1
    definition: "A product or method is implemented with a technology."
    signatures:
      - {subject_core: [Product, Method], object_core: [Technology]}
    evidence:
      classes: [usage_application]
      verbs: [implement, realize]
      multiword: ["implemented with", "implemented in", "written in", "powered by"]
      propbank_rolesets: [implement.01]
      framenet_frames: [Using, Execution]
    direction: {canonical: product_to_tech, inverse: implements, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: reject, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "Hermes is written in Python."

  - id: causes
    tier: 1
    definition: "Subject causes or produces an effect."
    signatures:
      - {subject_core: [Process, Event, Concept], object_core: [Process, Event, Concept]}
    evidence:
      classes: [causation]
      verbs: [cause, produce, induce, trigger]
      multiword: ["lead to", "leads to", "led to", "result in", "results in", "resulted in", "because of", "due to"]
      propbank_rolesets: [cause.01]
      framenet_frames: [Causation]
    direction: {canonical: cause_to_effect, inverse: caused_by, symmetry: asymmetric, transitivity: transitive_guarded}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, conditional: qualify, attributed: qualify_wrap_stated_in, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "CUDA context poisoning causes the sidecar to 500."

  - id: enables
    tier: 1
    definition: "A method or technology enables a process."
    signatures:
      - {subject_core: [Method, Technology], object_core: [Process]}
    evidence:
      classes: [causation]
      verbs: [enable, allow, permit, facilitate]
      multiword: ["makes it possible", "allows for"]
      propbank_rolesets: [enable.01]
    direction: {canonical: enabler_to_process, inverse: enabled_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, conditional: qualify, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "The durable queue enables crash-safe recovery."

  - id: influences
    tier: 1
    definition: "Subject influences, affects, or modulates an object."
    signatures:
      - {subject_core: [Person, Organization, Process, Concept, Method], object_core: [Process, Concept]}
    evidence:
      classes: [influence_affect]
      verbs: [influence, affect, modulate, shape, bias, sway]
      propbank_rolesets: [influence.01]
    direction: {canonical: influencer_to_influenced, inverse: influenced_by, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, conditional: qualify, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "Prompt length influences latency."

  - id: depends_on
    tier: 1
    definition: "A system, method, or process requires another to function."
    signatures:
      - {subject_core: [Product, Technology, Method, Process], object_core: [Technology, Method]}
    evidence:
      classes: [dependency]
      verbs: [require, need, depend]
      multiword: ["depends on", "requires", "relies on", "is a prerequisite for"]
      propbank_rolesets: [depend.01]
    direction: {canonical: dependent_to_requirement, inverse: dependent_of, symmetry: asymmetric, transitivity: transitive_guarded}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, conditional: qualify, question: reject}
    graph: {traversal_weight: high}
    examples:
      - "The worker depends on the outbox."

  - id: transforms_into
    tier: 1
    definition: "Subject converts into an object."
    signatures:
      - {subject_core: [Product, Concept, Process], object_core: [Product, Concept, Process]}
    evidence:
      classes: [transformation]
      verbs: [convert, transform, translate, compile]
      multiword: ["turns into", "turned into", "converts to", "compiles into", "maps to"]
      verbnet_classes: [turn-26.6]
      propbank_rolesets: [become.01, convert.01]
      framenet_frames: [Change_event]
    direction: {canonical: source_to_result, inverse: transformed_from, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, conditional: qualify, question: reject}
    graph: {traversal_weight: medium}
    examples:
      - "The YAML rule pack compiles into a decision DAG."

  - id: derived_from
    tier: 1
    definition: "An artifact derives from a source artifact."
    signatures:
      - {subject_core: [Document, Product, Concept], object_core: [Document, Concept]}
    evidence:
      classes: [transformation, reference_attribution]
      verbs: [derive, adapt, port, fork]
      multiword: ["derived from", "based on", "adapted from", "a fork of"]
      propbank_rolesets: [derive.01]
    direction: {canonical: artifact_to_source, inverse: derives, symmetry: asymmetric, transitivity: "false"}
    constraints: {negated: reject, hypothetical: qualify, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: medium}
    examples:
      - "v4 derives from the v3.3 census algorithm."

  - id: similar_to
    tier: 1
    definition: "Two entities resemble each other."
    signatures:
      - {subject_core: [Person, Organization, Product, Technology, Concept, Method], object_core: [Person, Organization, Product, Technology, Concept, Method]}
    evidence:
      classes: [comparison]
      verbs: [resemble, parallel, mirror]
      multiword: ["similar to", "like", "analogous to", "comparable to"]
      verbnet_classes: [correspond-36.1]
      propbank_rolesets: [resemble.01]
      framenet_frames: [Similarity]
    direction: {canonical: canonical_order, inverse: similar_to, symmetry: symmetric, transitivity: "false"}
    constraints: {negated: qualify, hypothetical: qualify, speculative: qualify, conditional: reject, question: reject}
    graph: {traversal_weight: low}
    examples:
      - "GLiNER resembles a small BERT encoder."

  - id: associated_with
    tier: 1
    definition: "Fallback association. Emitted only when no specific predicate applies."
    signatures:
      - {subject_core: [Person, Organization, Location, Product, Technology, Concept, Method, Event, Document, Process], object_core: [Person, Organization, Location, Product, Technology, Concept, Method, Event, Document, Process]}
    evidence:
      classes: [association]
      verbs: [relate, associate, link, connect]
      multiword: ["related to", "associated with", "linked to", "connected to"]
    direction: {canonical: canonical_order, inverse: associated_with, symmetry: symmetric, transitivity: "false"}
    constraints: {negated: qualify, hypothetical: qualify, speculative: qualify, conditional: qualify, question: reject}
    graph: {traversal_weight: low}
    examples:
      - "The report is loosely associated with the lab."
