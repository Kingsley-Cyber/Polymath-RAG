# compose.yaml: Polymath v4
# Only the data stores run in Docker. The orchestrator, workers,
# control plane, and sidecars are host-native. See ADR-0003.
# One exception, opt-in (the owner's decision of 2026-09-27, SUPPLIER-APIS):
# `searxng`, a local metasearch, not a store and not a model. Its profile
# keeps it out of a plain `docker compose up`; start it by name.

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: polymath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: polymath
    # The 12-process host-native fleet + control + operator tooling
    # saturates the 100-connection default (measured 2026-08-29).
    command: ["postgres", "-c", "max_connections=250"]
    # PG-SHM-V1 (measured 2026-09-05): Docker's default 64 MB /dev/shm made
    # parallel-query DSM segments fail with "could not resize shared memory
    # segment ... No space left on device" 192 times in 24 h (routing
    # projection, facts/evidence joins). Applies on the next `compose up`
    # recreate; until then max_parallel_workers_per_gather=0 is set via
    # ALTER SYSTEM so no query needs a DSM segment.
    shm_size: "1gb"
    volumes:
      - ./stores/postgres/data:/var/lib/postgresql/data
      - ./stores/postgres/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymath"]
    restart: unless-stopped

  qdrant:
    image: ${QDRANT_IMAGE}
    volumes:
      - ./stores/qdrant/snapshots:/qdrant/snapshots
    ports:
      - "127.0.0.1:6334:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.0\r\n\r\n' >&3"]
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - ./stores/neo4j/data:/data
      - ./stores/neo4j/constraints:/constraints
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE}
    volumes:
      - ./stores/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped

  # SUPPLIER-APIS (the owner's decision of 2026-09-27): a LOCAL SearXNG that turns a query into search-engine result snippets as
  # JSON, so research acquisition and supplier_search find alibaba.com listings without opening the site's pages (which show
  # human checks). Loopback only, half a CPU, 256 MB. Its settings are deployment/searxng/settings.yml (read-only in the
  # container, never chowned); its secret is SEARXNG_SECRET, passed through from .env and never written here (unset, SearXNG
  # refuses to start). Opt-in: `docker compose up -d searxng` (the profile keeps it out of `make db-up`).
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    profiles: ["search"]
    environment:
      - SEARXNG_SECRET
      - FORCE_OWNERSHIP=false
    volumes:
      - ./deployment/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
