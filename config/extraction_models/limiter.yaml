# Adaptive limiter seeds — LOCAL-LLM-EXTRACTION-V1 (2026-08-29).
# Static numbers are seeds + ceilings; adaptive=true lets the controller
# move the effective limit within [min, max] at runtime (AIMD: +1 per 8
# clean successes, x0.5 on 429/503/timeout, Retry-After honored).
# Keyed per (provider, api_key) — multi-key pools scale linearly.
providers:
  mlx_local:
    kind: concurrency      # local bottleneck = GPU/VRAM concurrency
    init: 2
    min: 1
    max: 4
    adaptive: true
  ollama_cloud:
    kind: rate             # cloud bottleneck = rate (RPM + TPM)
    rpm: 120               # seed bucket; header-sync refines it live
    tpm: 200000
    conc_cap: 18           # CEILING pinned just UNDER the measured provider
                           # edge (~19-20 concurrent triggers 429s). The
                           # 32-era probe policy found the edge but paid for
                           # every probe: burst past 19 -> 429 -> halve to
                           # ~5 -> minutes climbing back (receipts 2026-08-30:
                           # eff 5->19, 21 lifetime decreases). Capping at 18
                           # trades a sliver of peak concurrency for zero
                           # 429 storms. The found value still persists in
                           # llm_controller_state; raise the cap only with a
                           # measured reason (new provider tier, second key).
    min: 2
    max: 18
    adaptive: true
    use_headers: true      # throttle proactively from rate-limit headers
    init: 3                # AIMD starts LOW and climbs to the ceiling on
                           # clean successes — that is what makes it live
  # Per-ENDPOINT seeds (EXTRACTION-POOL): a pool endpoint whose name
  # matches a key here gets its own seed; otherwise it inherits
  # ollama_cloud. AIMD still governs at runtime (x0.5 on 429/503,
  # Retry-After honored, header sync) — these are starting buckets and
  # ceilings, not hard schedules.
  nvidia:                  # owner 2026-08-30: dedicated latent/enrichment
    kind: rate
    family: nvidia
    rpm: 36                # ~35-38 RPM initial per owner directive
    tpm: 150000
    conc_cap: 4            # worker-controlled concurrency; small ceiling
    min: 1
    max: 4
    init: 2
    adaptive: true
    use_headers: true
  openrouter1:             # OpenRouter paid key — mistral-small-2603 (Mistral
    kind: rate             # first-party endpoints); no published RPM: seeded
    family: openrouter     # conservatively, header ceiling adoption grows it
    rpm: 60
    tpm: 500000
    conc_cap: 4
    min: 1
    max: 4
    init: 2
  openrouter2:             # OpenRouter paid key — ministral-14b-2512
    kind: rate
