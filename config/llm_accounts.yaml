# LLM provider accounts — the single registry (register 11.465 L1; 11.467 L3; gaps L-01, L-02, L-07, L-14, L-20).
#
# One entry per ACCOUNT (one API key = one separate account). Under each account: the provider's own quota per model
# (when known) and the lanes configured on it (a lane = account x model x stage use; its limiter entry sits with it).
# Secrets stay in .env: this file only NAMES the variables (key_env, account_id_env).
#
# This file is the AUTHORING surface. config/cloud_providers.json and config/extraction_models/limiter.yaml are
# GENERATED from it (register 11.467): edit here, then run
#     .venv/bin/python scripts/llm_accounts.py write      # regenerate both runtime files
#     .venv/bin/python scripts/llm_accounts.py validate   # errors exit 1; warnings are policy findings
# tests/determinism/test_llm_accounts.py fails on any drift between this file and the runtime files.
#
# slots: worker processes per stage (control/control/process_supervisor.py FLEET; a test keeps the counts equal).
# `extract` is the shared pool of enabled, non-dedicated lanes. OWNERSHIP (L3): `owners` maps a slot NAME to the lanes
# it owns — its own account's lanes for that stage. The supervisor gives each slot its 1-based index in
# `lane_offset_env` (doc_profile -> 1, doc_profile2 -> 2, ...); an owning slot calls ITS OWN lanes first, then the
# shared tier (pin lanes no slot owns; names containing "fallback" last), and never another slot's own lanes. So each
# owned (account, model) pair has exactly one calling process and its per-process budget can be the whole pair.
#
# quota: Groq per key per model (owner 2026-09-23): 30 RPM / 1K RPD / 8K TPM / 200K TPD; groq_5 enforces OTPM 1000
# on qwen3.8-27b (canary 2026-09-23). Other providers' quotas are not recorded yet.
# Lane limiter tpd / rpd (L2 11.466, L3 11.467): the budget per PROCESS = 95 % of the pair's quota divided by the
# worker slots that can call the lane — an owned lane has one caller, so 190,000 tokens and 950 requests a day.
version: 1
slots:
  doc_profile:
    count: 6
    lane_offset_env: POLYMATH_DOC_PROFILE_LANE_OFFSET
    owners:
      doc_profile:
      - profile_groq1
      doc_profile2:
      - profile_groq2
      doc_profile3:
      - profile_groq3
      doc_profile4:
      - profile_groq4
      doc_profile5:
      - profile_groq5
      doc_profile6:
      - profile_groq6
  doc_parent_map:
    count: 6
    lane_offset_env: POLYMATH_DOC_PARENT_MAP_LANE_OFFSET
    owners:
      doc_parent_map:
      - map_groq1
      - map_groq1q
      doc_parent_map2:
      - map_groq2
      - map_groq2q
      doc_parent_map3:
      - map_groq3
      - map_groq3q
      doc_parent_map4:
      - map_groq4
      - map_groq4q
      doc_parent_map5:
      - map_groq5
      - map_groq5q
      doc_parent_map6:
      - map_groq6
      - map_groq6q
  extract:
    count: 3
  parent_enrichment:
    count: 2
    via: summaries
  chat_compiler:
    count: 1
    via: orchestrator
stage_pins:
  parent_enrichment:
  - openrouter1
  - openrouter2
  - openrouter3
  - openrouter5
  chat_compiler:
  - compiler_alibaba_deepseek
  - compiler_ollama_gemma
  - compiler_alt
  doc_profile:
  - profile_groq1
  - profile_groq2
  - profile_groq3
  - profile_groq4
  - profile_groq5
  - profile_groq6
  - profile_fallback_openrouter
  doc_parent_map:
  - map_groq1
  - map_groq2
  - map_groq3
  - map_groq4
  - map_groq5
  - map_groq6
  - map_groq1q
  - map_groq2q
  - map_groq3q
  - map_groq4q
  - map_groq5q
  - map_groq6q
  - map_fallback_openrouter
  - cloudflare_map2
accounts:
  # Groq (GROQ-MODEL-SWAP-2026-09-23): provider limits are INDEPENDENT per model per key (RPM 30 / RPD 1K / TPM 8K /
  # TPD 200K), so each key serves three pairs with their own budgets and their own limiter family.
  # openai/gpt-oss-120b (reasoning_effort low) = the document profile; openai/gpt-oss-20b (low) and qwen/qwen3.8-27b
  # (reasoning_effort none) = parent-map. One org enforces an output-tokens-per-minute cap of 1000 on qwen (canary 429
  # 'OTPM', groq_5), hence max_output_tokens 900 on every qwen lane and otpm 1000 on map_groq5q.
  # Measured (canary 2026-09-23): one profile call ~2.2-2.4K total tokens; a 15-parent map batch ~2.4-3.4K; AIMD
  # halves on 429. The limiter is per PROCESS, so ownership decides the budget: L3 (register 11.467) enables all 18
  # pairs and gives each exactly one calling process — profile slot N owns profile_groqN, pMAP slot N owns
  # map_groqN + map_groqNq — so each lane's rpd / tpd is the whole pair's (95 %). rpm 2 keeps a process under TPM 8K.
