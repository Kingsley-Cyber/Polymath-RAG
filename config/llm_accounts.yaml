# LLM provider accounts — the single registry (register 11.465, LLM-BACKEND L1; gap L-01).
#
# One entry per ACCOUNT (one API key = one separate account). Under each account: the provider's own quota per model
# (when known) and the lanes configured on it (a lane = account x model x stage use; its limiter entry sits with it).
# Secrets stay in .env: this file only NAMES the variables (key_env, account_id_env).
#
# The runtime still reads config/cloud_providers.json and config/extraction_models/limiter.yaml. They must equal what
# this file compiles to (tests/determinism/test_llm_accounts.py fails on any drift). Report and checks:
#     .venv/bin/python scripts/llm_accounts.py report | validate | diff
#
# slots: worker processes per stage (control/control/process_supervisor.py FLEET); `extract` is the shared pool of
# enabled, non-dedicated lanes. quota: Groq per key per model (owner 2026-09-23): 30 RPM / 1K RPD / 8K TPM / 200K TPD;
# groq_5 enforces OTPM 1000 on qwen3.8-27b (canary 2026-09-23). Other providers' quotas are not recorded yet.
version: 1
slots:
  doc_profile:
    count: 6
    lane_offset_env: POLYMATH_DOC_PROFILE_LANE_OFFSET
  doc_parent_map:
    count: 4
  extract:
    count: 3
  parent_enrichment:
    count: 2
    via: summaries
  chat_compiler:
    count: 1
    via: orchestrator
stage_pins:
  parent_enrichment:
  - openrouter1
  - openrouter2
  - openrouter3
  - openrouter5
  chat_compiler:
  - compiler_alibaba_deepseek
  - compiler_ollama_gemma
  - compiler_alt
  doc_profile:
  - profile_groq1
  - profile_fallback_openrouter
  doc_parent_map:
