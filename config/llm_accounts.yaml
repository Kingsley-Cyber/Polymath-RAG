  - map_groq3
  - map_groq4
  - map_groq5
  - map_groq6
  - map_groq2q
  - map_groq3q
  - map_groq4q
  - map_groq5q
  - map_groq6q
  - map_fallback_openrouter
  - cloudflare_map1
  - cloudflare_map2
