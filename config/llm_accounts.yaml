  # Cloudflare Workers AI (CLOUDFLARE-WORKERS-AI-V1 / CLOUDFLARE-PMAP-V1, @cf/qwen/qwen3-30b-a3b-fp8).
  # Six Free-plan accounts = six ISOLATED capacity domains (own family each, so a storm on one never cascades to the
  # others). The daily free allocation is enforced by the 3036 park (limiter.park_provider_day), not a local rpd —
  # Cloudflare bills in "neurons", not a published RPD; seeds are conservative and AIMD adapts to headers.
  # Owner split (2026-09-13): accounts 1-2 -> PARENT-MAP lanes (cloudflare_map1..2, the pMAP shared tier since L3);
  # accounts 3-6 -> graph-extraction helpers (cloudflare3..6). Lane names carry the account number. The URL embeds
  # the account id (url_template + account_id_env): a lane parks until CLOUDFLARE_ACCOUNT_ID_N is set. The API tokens
  # are Workers-AI-scoped: GET /client/v4/accounts lists 0 accounts for all six (2026-09-13 and 2026-09-24), so the
  # ids come from the owner (dashboard). Ids 2-6 are set and answered live (register 11.468).
  # Account 1 is RETIRED (the owner, 2026-09-24: "its okays for key 1 dispost of it"; its account id was never found —
  # the id list sent for it was account 2's). cloudflare_map1 is disabled and off the pMAP pin; the account entry stays
  # as the record (rollback: set its id, re-enable the lane, put it back on the pin, run the writer).
  cloudflare_1:
    provider: cloudflare
    key_env: CLOUDFLARE_API_TOKEN_1
    account_id_env: CLOUDFLARE_ACCOUNT_ID_1
    lanes:
      cloudflare_map1:
        enabled: false
        url_template: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai
        model: '@cf/qwen/qwen3-30b-a3b-fp8'
        reasoning_effort: null
        structured: text
        json_mode: false
        think_suffix: null
        dedicated: true
        request_char_budget: 18000
        map_batch_cap: 15
        limiter:
          kind: rate
          family: cloudflare_acct_1
          rpm: 30
          tpm: 100000
          conc_cap: 2
          min: 1
          max: 3
          init: 1
          adaptive: true
