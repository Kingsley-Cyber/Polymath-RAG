[project]
name = "polymath-workers"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "polymath-shared",
    "psycopg[binary]>=3.1,<4",
    "qdrant-client>=1.13,<1.14",
    "neo4j>=5.20,<6",
    "packageurl-python>=0.16,<1",   # TrailSignal's embedded core (governance/trail, ADR-0021): its platform contracts import PackageURL
]

[project.optional-dependencies]
extraction = ["gliner>=0.2", "spacy>=3.7,<4"]

[tool.setuptools.packages.find]
include = ["workers*"]
