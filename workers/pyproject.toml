[project]
name = "polymath-workers"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "polymath-shared",
    "psycopg[binary]>=3.1,<4",
    "qdrant-client>=1.9,<2",
    "neo4j>=5.20,<6",
]

[project.optional-dependencies]
extraction = ["gliner>=0.2", "spacy>=3.7,<4"]

[tool.setuptools.packages.find]
include = ["workers*"]
