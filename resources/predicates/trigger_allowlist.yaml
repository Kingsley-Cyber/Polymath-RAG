# TRIGGER ALLOWLIST — the production trigger authority.
#
# A trigger must be MANUALLY LICENSED. VerbNet may suggest; it may never
# expand the production vocabulary on its own.
#
# The compiler previously did `verbs.update(class_members)` in gate 5,
# merging every member of every cited VerbNet class into the trigger set.
# 112 authored verbs became 337 compiled triggers -- x3.0 -- across 8 of
# 28 predicates. `founded` inherited 58 verbs including `bake`, so "she
# baked a cake" could license founded(she, cake). `similar_to` inherited
# `collaborate`, which produced the observed skill--similar_to-->users.
#
# Those were not extraction failures. They were compiler failures, and
# Fact Admission is the wrong place to fix them: the compiler must stop
# making invalid accusations rather than the court acquitting them one
# at a time.
#
# POLICY
#   authored    verbs in the rule pack YAML, licensed by authorship
#   allow       a class member explicitly promoted into production
#   deny        a class member that must NEVER be licensed. Recorded so
#               no future expansion can re-admit it silently, and so the
#               reason this file exists stays legible.
#   suggested   what VerbNet offered and nobody licensed. Retained as
#               evidence, never compiled. This is the review queue.
#
# Adding to `allow` is a semantic change: new rule pack version, shadow
# comparison, measured. Exactly like any other.

policy: authored_only
contract: trigger-allowlist-v1

