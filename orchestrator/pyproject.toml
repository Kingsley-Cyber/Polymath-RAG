[project]
name = "polymath-orchestrator"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "polymath-shared",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # POLYMATH-UI-V1: multipart parsing for POST /upload
    "python-multipart>=0.0.9",
    # CI-GREEN-V1 (2026-10-01): chat synthesis, review and deep research call litellm (api/ui.py, compare_review.py,
    # deep_research.py); it was never declared, so a fresh install (CI) lacked it. Pinned to the fleet's version.
    "litellm==1.98.0",
]

[tool.setuptools.packages.find]
include = ["orchestrator*"]
