# spaCy syntax runtime manifest (ADR-0005 sidecar contract).
#
# Identity: pinned model release. en_core_web_sm 3.8.0 (the spaCy
# 3.8.x small English pipeline) installed from the pinned GitHub wheel
# URL in requirements.txt. weights_sha256 is the sha256 of the
# installed model data directory (29 files), pinned at install time —
# NOT trust-on-first-use: any reinstall that changes the model fails
# boot loudly.
#
# NER IS DISABLED in this runtime (loaded with disable=["ner",
# "senter"]). GLiNER remains Polymath's only entity proposal model;
# this sidecar serves syntax evidence only (syntax-evidence-v1).

[identity]
name = "spacy-syntax"
version = "syntax-evidence-v1"
release = "syntax-evidence-v1"

[identity.model]
id = "en_core_web_sm"
revision = "3.8.0"
weights_sha256 = "92e0ab7d01be1b1c62f0cf2249d7350293cbc750d5bd75e3c86774c703e21750"

[wire]
infer_path = "/infer"

[wire.request_schema]
type = "object"
required = ["sentences"]
properties.sentences = {type = "array", minItems = 1, maxItems = 512}

[wire.response_schema]
type = "object"
required = ["contract", "results", "model_release"]
properties.contract = {const = "syntax-evidence-v1"}

[health]
health_path = "/health"
ready_path = "/ready"

[runtime]
device = "cpu"        # host-native CPU / Apple Accelerate; never GLiNER's MPS path
backend = "apple"     # SPACY_BACKEND=apple|cpu; cpu blocks thinc-apple-ops explicitly
batch_size = 128      # SPACY_BATCH_SIZE; one nlp.pipe batch per request
n_process = 1         # single process: macOS spawn makes n_process>1 a net loss at sm scale
