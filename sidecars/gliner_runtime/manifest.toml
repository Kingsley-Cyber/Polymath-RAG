# GLiNER two-pass runtime manifest (ADR-0005).
#
# Identity: pinned model release. The revision is the HuggingFace git sha
# of urchade/gliner_medium-v2.1 (last modified 2024-08-21). Weights
# digest: trust-on-first-use until Phase C qualification records the
# sha256 of the downloaded snapshot here; an unpinned digest is refused
# in production (POLYMATH_REQUIRE_PINNED=1).

[identity]
name = "gliner-runtime"
version = "gliner-2pass-v1"
release = "gliner-2pass-v1"

[identity.model]
id = "urchade/gliner_medium-v2.1"
revision = "40ec419335d09393f298636f471328b722c6da9e"
weights_sha256 = "__PIN_WEIGHTS_SHA256__"

[wire]
infer_path = "/infer"

[wire.tasks]
entity = {threshold = 0.5}
evidence = {threshold = 0.4}

[health]
health_path = "/health"
ready_path = "/ready"

[runtime]
device = "mps"   # mps on Apple Silicon; cpu fallback is explicit, not silent
max_sequence_length = 512
