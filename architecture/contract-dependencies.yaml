# Semantic contract dependency map (Librarian / RAG retrieval).
#
# Complements architecture/dependencies.json (STRUCTURAL: layer/import rules). This file is
# the SEMANTIC layer: the architecture-level contracts that structural code graphs cannot see
# (a producer's output shape a downstream consumer assumes, a projection's lifecycle a receipt
# reader assumes). scripts/contract_impact.py reads it to answer "what contracts does this diff
# touch, and transitively affect?" — deterministically, no LLM.
#
# Keep it SMALL: architecture-level contracts only, not every function. `paths` maps changed
# files to a contract; `depends_on`/`consumed_by` give the transitive edges; `tests` are the
# owner path's proof; `status` is live | pending (not yet wired) | deferred.
version: v1

contracts:
  SURFACE_REGISTRY:
    owner: shared
    spec: shared/polymath_shared/surface_registry.py
    paths: [shared/polymath_shared/surface_registry.py]
    depends_on: []
    consumed_by: [PROFILE_ATOM, PROFILE_PROJECTION, PROFILE_SCOUT_INPUT, QUERY_INTENT]
    tests: [tests/determinism/test_surface_registry.py]
    migration: null
    status: live

  QUERY_INTENT:
    owner: shared
    spec: shared/polymath_shared/query_intent.py
    paths: [shared/polymath_shared/query_intent.py]
    depends_on: [SURFACE_REGISTRY]
    consumed_by: [QUERY_PLANNER, CANDIDATE_ENGINE]
    tests: [tests/determinism/test_u1_intent_routing_contract.py]
    migration: null
    status: live

  PROFILE_COMPILER:
    owner: shared
    spec: shared/polymath_shared/document_profile/selection.py
    paths: [shared/polymath_shared/document_profile/selection.py]
    depends_on: [SURFACE_REGISTRY]
    consumed_by: [PROFILE_PROJECTION]
    tests: [tests/determinism/test_profile_selection.py]
    migration: null
    status: live

  PROFILE_PROJECTION:
    owner: shared
    spec: shared/polymath_shared/document_profile/projection.py
    paths: [shared/polymath_shared/document_profile/projection.py]
    depends_on: [SURFACE_REGISTRY, PROFILE_COMPILER, PROJECTION_LIFECYCLE]
    consumed_by: [PROFILE_SCOUT_INPUT, CANDIDATE_ENGINE]
    tests: [tests/determinism/test_document_profile_projection.py]
    migration: null
    status: live

  PROFILE_ATOM:
    owner: shared
    spec: shared/polymath_shared/document_profile/profile_atom_projection.py
    paths:
      - shared/polymath_shared/document_profile/profile_atom.py
      - shared/polymath_shared/document_profile/profile_atom_projection.py
    depends_on: [SURFACE_REGISTRY]
    consumed_by: [PROFILE_SCOUT_INPUT, CANDIDATE_ENGINE]
    tests:
      - tests/determinism/test_profile_atom.py
      - tests/determinism/test_profile_atom_ingest.py
      - tests/determinism/test_profile_atom_corpus_scope.py
      - tests/contracts/test_search_atoms_callers_scoped.py   # pins every search_atoms caller's corpus scope (11.476)
    migration: stores/postgres/migrations/0055_document_profile_atoms.sql
    status: live

  PROFILE_SCOUT_INPUT:
    owner: orchestrator
    spec: docs/wiki/plans/PROFILE-SCOUT-V1.md
    paths: [shared/polymath_shared/document_profile/profile_scout.py]   # pure normalization (P5b-a)
    depends_on: [PROFILE_PROJECTION, PROFILE_ATOM, SURFACE_REGISTRY]
    consumed_by: [PROFILE_SCOUT_FUSION]
    tests: [tests/determinism/test_profile_scout.py]
    migration: null
    status: live                   # P5b-a: profile_hits_from_doc_ids + atom_hits_from_search

  PROFILE_SCOUT_FUSION:
    owner: shared
    spec: docs/wiki/plans/PROFILE-SCOUT-V1.md
    paths: [shared/polymath_shared/document_profile/profile_scout.py]
    depends_on: [PROFILE_SCOUT_INPUT]
    consumed_by: [PROFILE_SCOUT_OUTPUT]
    tests: [tests/determinism/test_profile_scout.py]
    migration: null
    status: live                   # P5a — pure fuse_profile_scout_hits

  PROFILE_SCOUT_OUTPUT:
    owner: shared
    spec: docs/wiki/plans/PROFILE-SCOUT-V1.md
    paths: [shared/polymath_shared/document_profile/profile_scout.py]
    depends_on: [PROFILE_SCOUT_FUSION]
    consumed_by: [PROFILE_SCOUT_WIRING, QUERY_PLANNER, SUBQUERY_PROVENANCE, PROFILE_YIELD_RECEIPT]
    tests: [tests/determinism/test_profile_scout.py]
    migration: null
    status: live                   # ProfileScoutResult / ProfileNomination schema (P6 depends on it)

  PROFILE_SCOUT_WIRING:
    owner: orchestrator
    spec: docs/wiki/plans/PROFILE-SCOUT-V1.md
    paths: [orchestrator/orchestrator/api/ui.py]   # pre-plan wiring + _compiler_titles retirement
    depends_on: [PROFILE_SCOUT_OUTPUT, PROFILE_PROJECTION, PROFILE_ATOM, QUERY_PLANNER]
    consumed_by: [QUERY_PLANNER]
    tests: []
    migration: null
    status: live                   # P5b-b: _profile_scout wired (flag POLYMATH_PROFILE_SCOUT, default off), B16 retired

  QUERY_PLANNER:
    owner: shared
    spec: shared/polymath_shared/chat_plan.py
    paths: [shared/polymath_shared/chat_plan.py]
    depends_on: [QUERY_INTENT]
    consumed_by: [CANDIDATE_ENGINE, SUBQUERY_PROVENANCE]
    tests: [tests/determinism/test_chat_funnel.py]
    migration: null
    status: live

  SUBQUERY_PROVENANCE:
    owner: shared
    spec: docs/wiki/plans/PROFILE-SCOUT-V1.md
    paths:
      - shared/polymath_shared/subquery_provenance.py
      - shared/polymath_shared/chat_plan.py
    depends_on: [QUERY_PLANNER, PROFILE_SCOUT_OUTPUT]
    consumed_by: [CANDIDATE_ENGINE, RETRIEVAL_RECEIPT, EVIDENCE_PACKET]
    tests: [tests/determinism/test_subquery_provenance.py]
    migration: null
    status: live                   # P6 — CompiledQuery provenance fields + pure annotate_subquery_provenance (unit-proven); ui.py wiring is L1-L5

  CANDIDATE_ENGINE:
    owner: shared
    spec: shared/polymath_shared/candidate_engine.py
    paths:
      - shared/polymath_shared/candidate_engine.py
      - orchestrator/orchestrator/api/chat_retrieval.py   # the lane callbacks the engine runs (11.476: a new search_atoms call here went unlisted)
    depends_on: [PROFILE_PROJECTION, PROFILE_ATOM, QUERY_PLANNER]
    consumed_by: [RETRIEVAL_RECEIPT]
    tests:
      - tests/determinism/test_candidate_engine.py
      - tests/determinism/test_chat_retrieval_v2.py
      - tests/contracts/test_search_atoms_callers_scoped.py
    migration: null
    status: live

  RETRIEVAL_RECEIPT:
    owner: shared
    spec: shared/polymath_shared/receipts.py
    paths: [shared/polymath_shared/receipts.py]
    depends_on: [CANDIDATE_ENGINE, PROJECTION_LIFECYCLE]
    consumed_by: [RESOLUTION_STATE, PROFILE_YIELD_RECEIPT, ACCEPTANCE]
    tests: [tests/determinism/test_projection_manifest_writer.py]
    migration: null
    status: live

  RESOLUTION_STATE:
    owner: shared
    spec: docs/wiki/plans/FINAL-RETRIEVAL-ROUTING-SYNTHESIS-V1.md
    paths: [shared/polymath_shared/evidence_resolution.py]
    depends_on: [RETRIEVAL_RECEIPT, QUERY_PLANNER]
    consumed_by: [ACCEPTANCE, PROFILE_YIELD_RECEIPT]
    tests: [tests/determinism/test_evidence_resolution.py]
    migration: null
    status: live                   # P10 — RetrievalState + ClaimState + bounded plan_resolution_round (unit-proven); driver wiring is L1-L5

  PROFILE_YIELD_RECEIPT:
    owner: shared
    spec: docs/wiki/plans/FINAL-RETRIEVAL-ROUTING-SYNTHESIS-V1.md
    paths: [shared/polymath_shared/profile_yield.py]
    depends_on: [RETRIEVAL_RECEIPT, PROFILE_SCOUT_OUTPUT, QUERY_PLANNER, RESOLUTION_STATE]
    consumed_by: [ACCEPTANCE]
    tests: [tests/determinism/test_profile_yield.py]
    migration: null
    status: live                   # P11 — profile_expansion_evidence_yield + librarian_receipt (unit-proven); receipt assembly wiring is L1-L5

  PROJECTION_LIFECYCLE:
    owner: shared
    spec: shared/polymath_shared/projection_lifecycle.py
    paths:
      - shared/polymath_shared/projection_lifecycle.py
      - shared/polymath_shared/projection_reconcile.py
    depends_on: []
    consumed_by: [PROFILE_PROJECTION, QDRANT_PROJECTION, NEO4J_PROJECTION, RETRIEVAL_RECEIPT]
    tests:
      - tests/determinism/test_projection_lifecycle.py
      - tests/determinism/test_projection_lifecycle_migration.py
      - tests/determinism/test_projection_reconcile.py
    migration: stores/postgres/migrations/0065_projection_lifecycle.sql
    status: live                   # migration 0065 applied 2026-09-18; the writer (L4) and live reconcile (L5) are dormant: gap D-06

  QDRANT_PROJECTION:
    owner: worker
    spec: workers/workers/project_qdrant_worker.py
    paths: [workers/workers/project_qdrant_worker.py]
    depends_on: [PROJECTION_LIFECYCLE, SURFACE_REGISTRY]
    consumed_by: [CANDIDATE_ENGINE]
    tests: []
    migration: null
    status: live

  NEO4J_PROJECTION:
    owner: worker
    spec: workers/workers/project_neo4j_worker.py
    paths: [workers/workers/project_neo4j_worker.py]
    depends_on: [PROJECTION_LIFECYCLE]
    consumed_by: [CANDIDATE_ENGINE]
    tests: []
    migration: null
    status: live

  ACCEPTANCE:
    owner: governance
    spec: docs/wiki/plans/FINAL-RETRIEVAL-ROUTING-SYNTHESIS-V1.md
    paths: [tests/integration/test_cross_domain_routing.py]
    depends_on: [RETRIEVAL_RECEIPT, RESOLUTION_STATE, PROFILE_YIELD_RECEIPT]
    consumed_by: []
    tests: [tests/integration/test_cross_domain_routing.py]
    migration: null
    status: live

  # ── GOVERNED-CONVERGENCE-V1 (TG1/TG2, 2026-09-20): the agent-facing evidence + cognitive-adapter surfaces. Until these four
  #    rows existed, contract_impact.py was blind to the EvidencePacket, the evidence route, the adapter runtime and both MCP
  #    servers — a change to any of them printed "no contract touched".
  EVIDENCE_PACKET:
    owner: shared
    spec: contracts/evidence/v1/evidence_packet.schema.json
    paths:
      - shared/polymath_shared/evidence_packet.py
      - contracts/evidence/v1/evidence_packet.schema.json
      - contracts/evidence/v1/evidence_packet.example.json
    depends_on: [SUBQUERY_PROVENANCE]
    consumed_by: [EVIDENCE_BOUNDARY_API, ADAPTER_RUNTIME]
    tests:
      - tests/determinism/test_evidence_packet.py
      - tests/contracts/test_evidence_packet_contract.py
    migration: null
    status: live                   # evidence-packet-v1; the JSON Schema is enforced CONSUMER-side (fail-closed) by ADAPTER_RUNTIME
                                   # EXTERNAL consumer (other repo, invisible to contract_impact): TRAIL_AGENT_AUTORESEARCH `schemas/evidence_packet.json`
                                   # pins this schema's sha256 (skill v2.2.0, TG3). Changing the schema = re-render + re-pin there, in the same slice.

  EVIDENCE_BOUNDARY_API:
    owner: orchestrator
    spec: orchestrator/orchestrator/api/chat.py
    paths:
      - orchestrator/orchestrator/api/chat.py
      - orchestrator/orchestrator/api/ui.py
    depends_on: [EVIDENCE_PACKET]
    consumed_by: [ADAPTER_RUNTIME, MCP_SURFACE]
    tests: [tests/determinism/test_chat_runtime.py, tests/determinism/test_query_receipts.py]
    migration: null
    status: live                   # POST /chat/evidence: full planning + Corpus Explore, NO synthesis; query receipt verdict = evidence_only.
                                   # DEBT (pre-existing at 94dbd57, not from TG1/TG2): one stale pin in EACH listed suite is red on untouched production
                                   # (chat.py receipt-writer count 2->4 since /chat/evidence; subquery tuple gained `origin`). Owner decision pending.

  ADAPTER_RUNTIME:
    owner: shared
    spec: contracts/adapter/v1/adapter_step.schema.json
    paths:
      - shared/polymath_shared/adapter/evidence_boundary.py
      - shared/polymath_shared/adapter/service.py
      - shared/polymath_shared/adapter/transitions.py
      - shared/polymath_shared/adapter/store.py
      - workers/workers/adapter_step_worker.py
      - orchestrator/orchestrator/api/adapter.py
      - contracts/adapter/v1/adapter_step.schema.json
      - config/adapters/trail.product_discovery.json
    depends_on: [EVIDENCE_PACKET, EVIDENCE_BOUNDARY_API]
    consumed_by: [MCP_SURFACE]
    tests:
      - tests/determinism/test_adapter_evidence_boundary.py
      - tests/contracts/test_adapter_worker_evidence_surface.py
      - tests/contracts/test_adapter_contract_v1.py
      - tests/determinism/test_adapter_runtime_pure.py
      - tests/determinism/test_adapter_product_discovery_loop.py
    migration: null
    status: live                   # adapter_next = step + readable `evidence`; knowledge surface opt-in per step (default legacy); live proof = R1 + scripts/adapter_evidence_boundary_proof.py

  MCP_SURFACE:
    owner: orchestrator
    spec: orchestrator/orchestrator/mcp_server.py
    paths:
      - orchestrator/orchestrator/mcp_server.py
      - mcp_server/polymath_mcp.py
      - orchestrator/orchestrator/api/capabilities.py
    depends_on: [ADAPTER_RUNTIME, EVIDENCE_BOUNDARY_API, RESEARCH_ACQUISITION]
    consumed_by: []
    tests: [tests/contracts/test_mcp_adapter_parity.py, tests/determinism/test_mcp_server_v2.py, tests/contracts/test_hosted_mcp_acceptance.py, tests/determinism/test_mcp_principals_gate.py, tests/contracts/test_mcp_principals_registry.py]
    migration: null
    status: live                   # Server A (http :8930, bearer) and Server B (stdio) serve the same seven adapter_* tools + the canonical trio

  RESEARCH_ACQUISITION:
    owner: shared
    spec: shared/polymath_shared/acquisition/service.py
    paths:
      - shared/polymath_shared/acquisition/service.py
      - shared/polymath_shared/acquisition/opencli.py
      - orchestrator/orchestrator/api/acquisition.py
    depends_on: [ADAPTER_RUNTIME]
    consumed_by: [MCP_SURFACE]
    tests: [tests/contracts/test_research_acquisition.py, tests/determinism/test_mcp_principals_gate.py]
    migration: null
    status: live                   # AUTORESEARCH R8: `research_acquire` (both servers) — owner-only reads for the run's OPEN HARNESS_ACTION; OpenCLI on the browser host
