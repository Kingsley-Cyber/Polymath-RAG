# Hard numeric gates evaluated by deterministic Python — the model never
# negotiates these.
evidence:
  min_independent_sources: 3      # observations from distinct sources to close a gap
  min_total_observations: 5       # floor before any mechanism may be declared supported
  max_research_rounds: 3          # web_research → curate → challenge loops before forced verdict
  allocation:                     # docs/20 §1: starvation is not refutation
    enforce_no_starved_rejection: true
bridge:
  max_inference_hops_without_evidence: 2
  require_hop_refs: true         # docs/19: when true, hops before the boundary must cite corpus/observation ids (hop_refs)
  require_evidence_boundary: true # every hypothesis must declare first_inference_at
  require_lived_anchor: true     # docs/25 §5: a hypothesis names ANCHOR lived clusters or declares grounding CORPUS_ONLY
supplier:
  require_price: true
  require_moq: true
  max_leads: 8
  moq_default_by_channel: {cjdropshipping: 1}   # docs/24 §2: dropship = single units
  require_mechanism_fit: true   # docs/19: a lead pairs a supplier with the mechanism it embodies, not with every mechanism
sourcing:                      # docs/20 §2: one sourcing job per concept — per channel (docs/24 §2)
  min_candidates_per_concept: 1
  channels: [alibaba, cjdropshipping]
evidence_channels: [reddit, amazon_reviews, youtube, tiktok, instagram, xiaohongshu, twitter, forum]   # docs/24 §1: compiled per gap, in this priority; every channel gets one intent before any gets a second (binding._round_robin)
ideation:                      # docs/19: the product SET
  min_concepts: 3
  max_concepts: 6
  min_variations: 2
corpus:                        # docs/19: corpus_plan reformulations
  min_queries: 3
  max_queries: 5
  question_forms:              # docs/25 §6: the corpus answers friction/mechanism/question-level asks, never per person
    - "What explains this workaround: {workaround}?"
    - "What mechanism reduces {friction} when {context}?"
    - "What analogous constraint exists elsewhere for {friction}?"
    - "Why do people keep doing {behavior} despite {friction}?"
  max_questions: 12
  relevance_classes: [LEXICAL_MATCH, SEMANTIC_MATCH, STRUCTURAL_ANALOGY, IRRELEVANT]   # docs/26 §2 axis 1 — θ classifies, φ enforces (IRRELEVANT rows are never citable)
  interpretation_kinds: [ACTIVITY, ROUTINE, OBJECT, OBJECT_INTERACTION, BODY_STATE, ENVIRONMENT, CONSTRAINT, FRICTION, DESIRE, TRADEOFF,
                         ADAPTATION, WORKAROUND, SOCIAL_DYNAMIC, IDENTITY_SIGNAL, TRANSITION, FAILURE_MODE, REPETITION, COORDINATION_PROBLEM,
                         ACCESS_PROBLEM, COMFORT_PROBLEM, STATUS_PROBLEM, ATTENTION_PROBLEM, TRANSFERABLE_INVARIANT, CAUSAL_MECHANISM]
scoring:
  min_mechanism_support: 3        # supporting observations per mechanism
  purchase_language_bonus: 2      # observations with purchase language count extra

# ── Evidence-authority layer (docs/04-evidence-authority.txt, 2026-08-10) ──
# Relevance determines whether evidence is worth considering; evidentiary
# authority determines what it may ESTABLISH. Never interchangeable.
evidence_roles:
  valid: [MECHANISM_SUPPORT, BEHAVIOR_SUPPORT, FRICTION_EVIDENCE, WORKAROUND_EVIDENCE,
          PURCHASE_INTENT, PRODUCT_REQUEST, PRODUCT_COMPLAINT, PRODUCT_COMPARISON,
          PRODUCT_MODIFICATION, CONTRADICTION, CURRENT_PRODUCT_REFERENCE,
          PRODUCT_DELTA_SUPPORT, SUPPLIER_AVAILABILITY, PRICE_EVIDENCE, MOQ_EVIDENCE,
          CUSTOMIZATION_EVIDENCE, FULFILLMENT_EVIDENCE, INSIDER_LANGUAGE]
knowledge_roles:
  valid: [BEHAVIORAL, CULTURAL, COMMUNITY, PATTERN, TECHNICAL, COMMERCE,
          CONSUMER_FIELD, SUPPLIER, HISTORICAL]
freshness_classes: [EVERGREEN, SLOW, FAST, LIVE]

source_suitability:
  corpus_evergreen:
    may_support: [MECHANISM_SUPPORT, BEHAVIOR_SUPPORT, CONTRADICTION]
  community:          # reddit / forums / youtube comments
    may_support: [FRICTION_EVIDENCE, WORKAROUND_EVIDENCE, PRODUCT_REQUEST,
                  PURCHASE_INTENT, BEHAVIOR_SUPPORT, PRODUCT_COMPARISON,
                  PRODUCT_MODIFICATION, CONTRADICTION, INSIDER_LANGUAGE]
  review:             # amazon and marketplace reviews / Q&A
    may_support: [PRODUCT_COMPLAINT, PRODUCT_COMPARISON, PRODUCT_DELTA_SUPPORT,
                  CURRENT_PRODUCT_REFERENCE, WORKAROUND_EVIDENCE, PRODUCT_REQUEST,
                  PURCHASE_INTENT, CONTRADICTION]
  marketplace_listing: # amazon/CJ listings as product references
    may_support: [CURRENT_PRODUCT_REFERENCE, PRICE_EVIDENCE]
  supplier:           # alibaba / CJ supplier side
    may_support: [SUPPLIER_AVAILABILITY, PRICE_EVIDENCE, MOQ_EVIDENCE,
                  CUSTOMIZATION_EVIDENCE, FULFILLMENT_EVIDENCE, INSIDER_LANGUAGE]

freshness_requirements:      # claim-relative, not document-relative
  MECHANISM_SUPPORT:        [EVERGREEN, SLOW, FAST, LIVE]
  BEHAVIOR_SUPPORT:         [FAST, LIVE]
  FRICTION_EVIDENCE:        [FAST, LIVE]
  WORKAROUND_EVIDENCE:      [FAST, LIVE]
  PURCHASE_INTENT:          [FAST, LIVE]
  PRODUCT_REQUEST:          [FAST, LIVE]
  PRODUCT_COMPLAINT:        [FAST, LIVE]
  PRODUCT_COMPARISON:       [FAST, LIVE]
  PRODUCT_MODIFICATION:     [FAST, LIVE]
  CONTRADICTION:            [EVERGREEN, SLOW, FAST, LIVE]
  INSIDER_LANGUAGE:         [FAST, LIVE]
  CURRENT_PRODUCT_REFERENCE: [LIVE]
  PRODUCT_DELTA_SUPPORT:    [FAST, LIVE]
  SUPPLIER_AVAILABILITY:    [LIVE]
  PRICE_EVIDENCE:           [LIVE]
  MOQ_EVIDENCE:             [LIVE]
  CUSTOMIZATION_EVIDENCE:   [LIVE]
  FULFILLMENT_EVIDENCE:     [LIVE]

physical_product_requirements:   # role COVERAGE, not evidence counts
  mechanism:        {required: true,  roles: [MECHANISM_SUPPORT]}
  real_behavior:    {required: true,  roles: [BEHAVIOR_SUPPORT, WORKAROUND_EVIDENCE]}
  friction_or_desire: {required: true, roles: [FRICTION_EVIDENCE, PRODUCT_REQUEST, PURCHASE_INTENT]}
  contradiction_search: {required: true, roles: [CONTRADICTION], allow_empty_after_search: true}
  supplier:         {required_for: [SOURCING_READY, QUALIFIED_LEAD], roles: [SUPPLIER_AVAILABILITY]}
  price:            {required_for: [SOURCING_READY, QUALIFIED_LEAD], roles: [PRICE_EVIDENCE]}

independence_defaults:
  minimum_independent_groups: 3     # distinct (platform,author) groups per requirement
  minimum_source_families: 1

# ── Breadth layer (docs/07): corpus -> primitives -> portfolio -> triage ──
breadth:
  max_cross_domain_analogies: 8
  require_invariant_for_transfer: true   # no shared invariant -> no expansion
portfolio:
  min_hypotheses: 3                      # cover mechanism FAMILIES, not variants
  max_hypotheses: 6
  max_exploratory: 1                     # one EXPLORATORY_TRANSFER allowed
  distinct_target_mechanisms: true       # five magnetic clips = one hypothesis
  min_lived_anchored: 2                  # docs/25 §5: at least this many hypotheses anchor in lived clusters
triage:
  max_research_ready: 3                  # info-gain budget: research the few that teach most
  min_priority: 2                        # below this -> HOLD (prior, never evidence)

# ── Context Engineering (docs/10): the window is a projection, not memory ──
context:
  hard_invariants:
    - physical_ecommerce_products_only
    - evidence_authority            # roles + suitability decide, never vibes
    - no_registry_mutation_in_run
    - 3_to_6_product_portfolio
    - backfill_recovers_never_researches
  budgets:
    max_chars: 60000                # deterministic trim: P4 -> P3 -> P2, never P0/P1

# ── Commercial Intelligence (docs/11): θ generates angles, φ admits them ──
commercial_intelligence:
  angle_types: [MARKET, PRODUCT, STYLE, COLLECTION, AD]
  hook_types: [INSIDER_PROBLEM, HIDDEN_UPGRADE, DISCOVERY, PERFORMANCE,
               IDENTITY_STYLE, CONVENIENCE, CONTRARIAN, SEASONAL, TRANSITION,
               BEGINNER_MISTAKE, EXPERT_PREFERENCE, COMPARISON, VALUE]
  grounded_min_refs: 2              # >=2 resolving refs -> GROUNDED; 1 -> PARTIAL; 0 -> SPECULATIVE
  dedupe_jaccard: 0.6               # normalized thesis-token overlap above this = duplicate
  genericness_lexicon: [help, helps, better, improve, improves, easier, great,
                        quality, "must have", "game changer", best, amazing,
                        upgrade your, boost, enhance, perfect]
  genericness_reject: 0.34          # fraction of thesis tokens that are generic
  angle_portfolio:
    size_min: 3
    size_max: 8
    hook_coverage_weight: 1.0       # optimize the SET: distinct hook types, not top-N scores
    redundancy_penalty: 0.8
  classifications: [OBSERVED, INFERRED, SIMULATED, CURRENT_SIGNAL,
                    WORKING_HYPOTHESIS, CREATIVE_RECOMMENDATION]
  chain_links: [evidence, observation, interpretation, market_implication,
                product_implication, ad_implication]

# ── MARKET_DISCOVERY (docs/12, docs/14) ──────────────────────────────────
market_discovery:
  max_research_rounds: 2
  frontier:                         # M(s): "worth digging into", never "will make money"
    weights: {attention: 1.0, community: 1.2, whitespace: 1.3, job_richness: 1.0,
              currentness: 0.8, sourceability: 0.7, transfer: 0.6,
              redundancy: -0.8, saturation: -1.0}
    explore_threshold: 0.55
    maybe_threshold: 0.35
    diversity_lambda: 0.5           # M'(s) = M(s) - λ·max Sim(s, selected)
    retain_min: 3
    retain_max: 8
  divergence:                       # channel disagreement thresholds
    high: 0.6
    low: 0.4
  robustness:
    perturbation: 0.2               # ±20% one-weight-at-a-time rank stability

# ── PRODUCT_ANCHORED_DISCOVERY (docs/13, docs/14) ────────────────────────
product_anchored:
  max_research_rounds: 2
  reverse_fit:                      # R(n|p): research-budget routing only
    weights: {mechanism_fit: 1.0, job_fit: 1.0, community_richness: 1.2,
              language_coherence: 0.8, currentness: 0.6, differentiation: 0.8,
              ecommerce_compatibility: 0.7, assumption_distance: -0.9,
              saturation: -0.8, redundancy: -0.7}
    explore_threshold: 0.5
    maybe_threshold: 0.3
    diversity_lambda: 0.5
    bridge_target: 3                # top bridges must be meaningfully DIFFERENT markets
  robustness:
    perturbation: 0.2

# ── System-locked authority laws (docs/14 §34) — never user-disableable ──
authority_laws:
  - supplier_listing_never_demand
  - trends_never_sales
  - comments_never_prevalence
  - simulation_never_evidence
  - corpus_relevance_never_market_proof
  - seller_claims_never_facts
  - failed_search_never_contradiction
  - single_viral_thread_never_independent

# ── System safety ceilings (docs/16) — SYSTEM_LOCKED, never user-settable ──
# "Loop until X" = attempt X within THESE; stagnation always wins.
system_limits:
  loadout_discovery_rounds_max: 3   # extra discovery loops beyond the first pass

# ── Registry flywheel + gap analysis (docs/17) ───────────────────────────
opportunity_genesis:            # research EMPHASIS only — never evidence authority
  valid: [PROBLEM_LED, SHIFT_LED, TREND_LED, DEMAND_REROUTE, CAPABILITY_LED,
          WORKAROUND_LED, COMMUNITY_LED, SUPPLY_TRANSFER_LED]
maintenance_triggers:           # deterministic; SYSTEM behavior, not user knobs
  recurrence_min_runs: 2
  negative_min_runs: 2
  query_yield_min_runs: 2
  source_yield_min_runs: 2
capture_feasibility:            # decomposed dims -> categorical routing judgment
  weights: {competitor_fragmentation: 1.0, differentiation_clarity: 1.0,
            niche_specificity: 0.8, organic_contentability: 0.8,
            visual_demonstrability: 0.7, creator_channel_fit: 0.7,
            supplier_flexibility: 0.6, margin_room: 0.8,
            incumbent_lock_in: -1.0, switching_friction: -0.7,
            trust_barrier: -0.8, regulatory_burden: -1.0}
  easy_threshold: 0.6
  plausible_threshold: 0.4
  difficult_threshold: 0.2      # below this -> HOSTILE

# ── LIVED-WORLD-V2 (docs/25): population discovery before ideation ────────
lived_world:
  anchor_threshold:              # a cluster may ANCHOR lived-situation reasoning only at or above ALL of these
    min_records: 5
    min_threads: 2
    min_independent_voices: 3    # verifiers.independence_groups over the cluster's records
  batch_size: 4                  # leads instantiated per round (VOI-ranked work queue, no fan-out)
  max_rounds: 3                  # population rounds before the run proceeds with what it has
  min_anchor_clusters: 2         # the gate wants at least this many ANCHOR clusters
  wall_clock_minutes: 45         # ceiling on population discovery per run
  stagnation_rounds: 1           # rounds with no new record and no new ANCHOR before stopping
  seed_population_discount: 0.5  # VOI multiplier for leads that restate the signal's own population
  nominate_max_registry: 6       # registry situations nominated per run (predicate/friction overlap)
  nominate_max_latent: 6         # docs/26 §4: latent structures searched for their population (LATENT PROBLEM → population)
  value_of_information:
    default_source_yield: {SIGNAL: 0.8, FIELD_RECORDS: 0.7, OPEN_FIELD: 0.7, CORPUS: 0.6, LATENT: 0.6, REGISTRY: 0.5}
provenance:                      # docs/25 §7: lineage decides what may count, never a category blacklist
  min_independent_voices: 3      # per concept, over the field records + observations it cites
  min_communities: 2
  echo_verdict: CORPUS_ECHO_UNGROUNDED
calibration:                     # docs/26 §6: the nine canaries — bridge behaviour, never shelf composition
  mandatory: [corpus_independence, open_field_population_discovery, field_originated_opportunity, irrelevant_source_rejection, hypothesis_death]
  conditional: [noun_echo_resistance, legitimate_corpus_overlap_survival]
  advisory: [latent_population_resolution]                   # STANDARD mode: reported PASS/FAIL, never gates
  source_agnostic_mandatory: [heterogeneous_source_reasoning, latent_population_resolution]   # --calibration-mode SOURCE_AGNOSTIC_CALIBRATION
  min_independent_voices: 3

seed_check:                      # PRODUCT-SEARCH-E2E F12: a seed that can generate nothing is told so at start, plainly (binding understanding.seed_check)
  # a seed is NOT generative when it carries merchandising markers and none of: a problem, an audience, a situation, an activity.
  # Vocabulary is DATA (lowercase words / phrases, matched on word boundaries); the corpus seed (no seed at all) is always allowed.
  merchandising: [under, "$", dollar, dollars, cheap, budget, affordable, bargain, deal, deals, discount, price, priced, holiday, holidays,
                  christmas, xmas, gift, gifts, birthday, "black friday", "cyber monday", valentine, valentines, "mother's day", "father's day",
                  "stocking stuffer", "stocking stuffers", halloween, easter, best, top, trending, viral, popular, hot, bestseller, bestsellers,
                  "best selling", "best-selling", winning, ideas, products, product, items, item, things, stuff, niche, niches, dropshipping,
                  dropship, sell, selling, resell, profitable, margin, "high margin", "high-margin"]
  problem: [problem, problems, pain, painful, struggle, struggles, struggling, hard, difficult, annoying, annoyed, frustrating, frustrated, hate,
            "can't", cannot, "won't", keeps, keep, lose, loses, losing, lost, forget, forgets, forgetting, spill, spills, break, breaks, broken,
            mess, messy, tired, tire, tires, sore, hurt, hurts, uncomfortable, slip, slips, slipping, fall, falls, falling, leak, leaks, tangle,
            tangled, noise, noisy, smell, smells, wet, dirty, clean, cleaning, fix, repair, workaround, workarounds, hack, hacks, without, trouble,
            issue, issues, friction, waste, wasting, overwhelmed, stress, stressful, worry, worried, afraid, fear, risk, unsafe, bounce, bounces,
            drop, drops, dropping, carry, carrying, access, reach, store, storing, organize, organizing, save, saving]
  audience: [people, person, parents, parent, moms, mothers, dads, fathers, kids, children, toddlers, babies, teens, teenagers, students,
             seniors, elderly, nurses, doctors, teachers, runners, cyclists, hikers, campers, gardeners, cooks, chefs, bakers, drivers, commuters,
             travelers, travellers, gamers, musicians, photographers, owners, workers, freelancers, renters, homeowners, athletes, climbers,
             swimmers, surfers, skiers, anglers, hunters, crafters, knitters, makers, mechanics, electricians, plumbers, carpenters, veterans,
             patients, caregivers, women, men, couples, families, beginners, crew, crews, team, teams, retirees, nomads, creators]
  situation: [when, while, during, after, before, night, morning, "on the go", commute, commuting, travel, traveling, travelling, trip, trips,
              outdoors, outdoor, home, work, car, kitchen, rain, winter, summer, workout, gym, office, shift, school, college, dorm, apartment,
              "small space", "small spaces", moving, long, daily, every day, routine, routines, recovery]
  activity_suffix: ing             # a word ending in this (5+ letters) is an activity unless the merchandising list holds it
  hint: >-
    Rewrite the seed as a problem, an audience or a situation — who struggles with what, and when (for example "commuters' coffee
    spills in the car" or "parents juggling bags and a toddler at the store") — or leave the seed out and the run proposes one from
    its corpora.

# ── PRODUCT-DECISION-REPORT-V1 §2 / §4.4 (B3): the decision report's sales channels — fees, delivery rules, sources ──
# unit_economics.py holds no rate or threshold of its own: it reads every number below, and every report prints each rule with the
# URL of the page behind it and the date that page was read (the planning session read them on 2026-11-02). A rule the plan set
# itself (Amazon's 10-day WARN line) says so in `basis`.
sales_channels:
  read_on: "2026-11-02"
  order: [tiktok_us, tiktok_cross_border, shopify, ebay, amazon_fbm]
  fee_base: >-
    every fee formula is charged on price + shipping the buyer pays; the report prices each sale at the market's delivered price
    with free shipping to the buyer, so that base is the sell price and the seller's own shipping is a cost
  channels:
    tiktok_us:
      label: TikTok Shop US (local seller account)
      fee: {kind: percent, rate_pct: 6.0}
      sensitivity: {id: tiktok_8pct, rate_pct: 8.0, status: UNCONFIRMED, sources: [tiktok_8pct_fbatactics, tiktok_8pct_delzonic, tiktok_8pct_unconfirmed]}
      delivery:
        kind: us_local_only
        origins: [US]                          # US local seller shipping is domestic only: shipped from China = FAIL
        max_handling_business_days: 2          # first carrier scan ("In Transit") within 2 business days of Awaiting Shipment
        max_delivery_business_days: 6          # Delivered within 6 business days of Awaiting Shipment
        custom_handling_business_days: [3, 7]  # custom handling time: delivered within handling + 5 business days
        custom_handling_extra_delivery_business_days: 5
      sources: [tiktok_fulfillment_policy, tiktok_seller_shipping, tiktok_referral_fees]
    tiktok_cross_border:
      label: TikTok Shop US (cross-border seller account)
      fee: {kind: percent, rate_pct: 6.0}
      sensitivity: {id: tiktok_8pct, rate_pct: 8.0, status: UNCONFIRMED, sources: [tiktok_8pct_fbatactics, tiktok_8pct_delzonic, tiktok_8pct_unconfirmed]}
      delivery:
        kind: max_days
        days: calendar
        max_in_transit_calendar_days: 3        # cross-border direct mail: In Transit within 3 calendar days
        max_delivery_days: 15                  # Delivered within 15 calendar days
        over: FAIL
        overseas_warehouse: {max_handling_business_days: 2, max_delivery_business_days: 6}   # the same page's rule for stock in a US warehouse
      sources: [tiktok_cross_border_fulfillment, tiktok_referral_fees]
    shopify:
      label: Shopify (own store, Basic plan)
      fee: {kind: percent_fixed_plan, rate_pct: 2.9, fixed_usd: 0.30, plan: Basic, plan_monthly_usd: 39.00}   # plan ÷ report_settings shopify_monthly_orders
      delivery:
        kind: max_days
        days: calendar
        max_delivery_days: 7                   # above 7 days = WARN (McKinsey: most shoppers still buy at 4-7 days when delivery is free)
        over: WARN
        ftc_ship_within_days: 30               # FTC Mail, Internet, or Telephone Order Merchandise Rule: the stated time, else 30 days
      sources: [shopify_pricing, ftc_mail_order_rule, mckinsey_delivery]
    ebay:
      label: eBay US
      fee: {kind: percent_per_order, rate_pct: 13.6, per_order: [{max_order_usd: 10.00, fee_usd: 0.30}, {fee_usd: 0.40}]}
      delivery:
        kind: honest_handling                  # allowed with an honest handling time; the report adds free-shipping badge eligibility
        badge_max_handling_business_days: 1    # same-day or 1-day handling
        badge_max_delivery_business_days: 4    # estimated delivery 4 business days or less
      sources: [ebay_selling_fees, ebay_delivery_dates, ebay_dropshipping, ebay_item_location]
    amazon_fbm:
      label: Amazon (seller-fulfilled, Individual plan)
      fee: {kind: referral_min_per_item, rate_pct: 15.0, min_referral_usd: 0.30, per_item_usd: 0.99}
      delivery:
        kind: max_days
        days: calendar
        max_delivery_days: 10                  # above 10 days = WARN
        basis: "plan threshold (PRODUCT-DECISION-REPORT-V1 §2, owner-approved 2026-11-02): Amazon publishes no day limit for seller-fulfilled offers, only an accurate promise"
        over: WARN
        prime_fail_origins: [CN]               # Seller Fulfilled Prime cannot be met from China
      sources: [amazon_pricing, amazon_fee_schedule, amazon_handling_time, amazon_vtr, amazon_sfp, amazon_dropshipping]
  sources:
    tiktok_fulfillment_policy:
      url: "https://seller-us.tiktok.com/university/essay?knowledge_id=3995852763301633&lang=en"
      title: "TikTok Shop Academy (US): Fulfillment Policy"
      read: "2026-11-02"
      backs: "regular orders: In Transit within 2 business days and Delivered within 6 business days of Awaiting Shipment; custom handling (3-7 business days): Delivered within handling + 5 business days; business days exclude weekends and US federal holidays"
    tiktok_seller_shipping:
      url: "https://seller-us.tiktok.com/university/essay?knowledge_id=8308896260065025&lang=en"
      title: "TikTok Shop Academy (US): Seller Shipping: Overview and Services"
      published: "2026-08-12"
      read: "2026-11-02"
      backs: "US seller shipping is local to local (domestic) only; cross-border orders are not permitted on the US platform"
    tiktok_cross_border_fulfillment:
      url: "https://seller.tiktokglobalshop.com/university/essay?anchor_link=EBA300CF&from=policy&identity=1&knowledge_id=7089769777235729&role=1"
      title: "TikTok Shop Global Seller University: 履约规则(美国跨境) (fulfillment rules, US cross-border)"
      read: "2026-11-02"
      backs: "cross-border direct mail: In Transit within 3 calendar days, Delivered within 15 calendar days of Awaiting Shipment; stock in an overseas (US) warehouse: In Transit within 2, Delivered within 6 business days"
    tiktok_referral_fees:
      url: "https://seller-us.tiktok.com/university/essay?knowledge_id=5988482086864682&lang=en"
      title: "TikTok Shop Academy (US): Referral Fees by Category"
      read: "2026-11-02"
      backs: "6 % referral fee for most categories (5 % for some jewelry and pre-owned)"
    tiktok_8pct_fbatactics:
      url: "https://fbatactics.com/guides/tiktok-shop-fee-increase-2026/"
      title: "FBA Tactics: TikTok Shop US Referral Fee Now 8% (trade blog)"
      published: "2026-08-25"
      read: "2026-11-02"
      backs: "reports 8 % for most US non-food categories from 2026-08-04; cites no TikTok notice (UNCONFIRMED)"
    tiktok_8pct_delzonic:
      url: "https://delzonic.com/blogs/tiktok-shop-fee-increase-2026/"
      title: "Delzonic: TikTok Shop Fee Increase 2026: The New 8% Rate (trade blog)"
      published: "2026-08-28"
      read: "2026-11-02"
      backs: "reports the same 8 % rate; cites no TikTok notice (UNCONFIRMED)"
    tiktok_8pct_unconfirmed:
      url: "https://marketplacebeta.com/fees/tiktok-shop/fee-change-2026"
      title: "MarketplaceBeta: TikTok Shop 8% Fee Increase (2026): What's Confirmed, What Isn't"
      published: "2026-10-21"
      read: "2026-11-02"
      backs: "TikTok's own US table dated 2026-10-08 still lists 6 %; no TikTok notice of 8 % found; check your settlement report"
    shopify_pricing:
      url: "https://www.shopify.com/pricing"
      title: "Shopify Pricing"
      read: "2026-11-02"
      backs: "Basic plan $39 USD/month paid monthly ($29/month billed yearly); online card rate 2.9 % + 30¢ on Basic"
    ftc_mail_order_rule:
      url: "https://www.ftc.gov/business-guidance/resources/business-guide-ftcs-mail-internet-or-telephone-order-merchandise-rule"
