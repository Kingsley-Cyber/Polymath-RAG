# ── PRODUCT-DECISION-REPORT-V1 §0 / §4.4 (B3): the decision report's settings ──
report_settings:
  defaults:                          # a report's `settings` may override these (the owner's decisions of 2026-11-02)
    shopify_monthly_orders: 100      # the Shopify plan fee per order = plan_monthly_usd ÷ this
    returns_rate: 0.193              # share of sales returned; allowance per sale = rate × (unit cost + shipping)
    ship_to: US                      # the only market the channel rules above describe
    last_mile_usd: null              # the owner's own cost to ship ONE order from US stock — used for inventory (Alibaba) offers only when
    last_mile_days: null             # the candidate has no CJ US→US quote; null = UNKNOWN, never guessed
    handling_business_days: 1        # business days from the order to the first carrier scan; every delivery rule whose clock starts at the order counts it
  returns_rate_source: nrf_returns_2025
  min_comps_for_reference: 3         # reference price = Amazon median at n ≥ this, else the pooled Amazon + eBay median at n ≥ this, else UNKNOWN
  supplier_days_read_as: calendar    # a quote's "4-9 days" is read as calendar days; a rule in business days is checked on the worst week (fewest weekend days)
  alibaba_origin_default: CN         # an alibaba.com listing ships from China unless it states another origin
  last_mile_weight_tolerance: 0.25   # a CJ US→US quote stands in for an inventory offer's last mile only when the offer is at most 25 % heavier
  reddit_comments_max: 5             # demand.reddit.comments: at most this many, by points then date
  reddit_comment_chars: 300
