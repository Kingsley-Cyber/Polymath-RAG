# Fair inference contract (identical for every model)
contract:
  corpus: realistic_smoke_v1
  gold: eval/gold/ep1_dev_gold.yaml
  labels: production-label-inventory          # profile router labels, no per-model rewriting
  mapping: production-label-mapping           # extract_worker._map_label
  threshold_grid: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  threshold_selection_set: dev-only
  device: mps
  dtype: fp32
  library:
    gliner: 0.2.28
    torch: 2.13.0
    transformers: 5.13.1
