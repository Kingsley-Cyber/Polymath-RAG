# EP1 entity-mention gold — DEVELOPMENT corpus (realistic_smoke_v1).
#
# Annotates ENTITY MENTIONS only (never relations). For each mention:
#   surface    canonical exact span text (as it appears in the source)
#   core_type  frozen-ontology core type
#   multiword  true when span integrity matters ("working memory" over "memory")
#   head       head token(s) that must be inside a proposed span for
#              overlap-recall credit
# Timestamps and speaker markers are deliberately ABSENT: proposals of
# them are measured as false spans (noise control requirement).
# Gold is authored from the source text, never from extraction output.

