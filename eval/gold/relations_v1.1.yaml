# Corpus v1.1 — the lexical-semantic boundary corpus (Phase H gate).
#
# ADDITIVE to relations_v1.yaml (v1.0 remains the control corpus,
# untouched). v1.1 deliberately exercises the boundary between the
# lexical baseline and the resource-enriched hybrid:
#
#   band E  EXPANDED_POSITIVE   trigger outside the manual vocabulary,
#                               recoverable through compiled resources
#   band T  CLASS_BREADTH_TRAP  class expansion would create a WRONG edge
#   band P  POLYSEMY            multi-sense contrast sets
#   band V  PASSIVE_PARSE       frozen syntactic evidence for direction
#   band A  ARG1_ARG2           theme->result pairing (W2 exposure)
#   band M  ASSERTION_CONTROL   modality/negation x expansion
#   band G  ALIGNMENT_GAP       recorded SemLink->VN id misalignment
#   band S  STRUCTURAL          manual-only predicates
#   band N  NO_RELATION         correct-abstention controls
#
# Gold is authored independently from sentence semantics. It is NEVER
# derived from compiler output. Per-item coverage flags are provenance
# recorded from the vendored compiled tables at freeze time.
#
# FREEZE: this file is immutable once evaluation starts. Any later gold
# defect requires a new corpus version, never an edit.

version: "1.1"
parent_control: "relations_v1.yaml@1.0"

