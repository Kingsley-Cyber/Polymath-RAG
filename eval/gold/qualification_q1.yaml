# Qualification corpus Q1 — heterogeneous production extraction gate.
#
# Authored from sentence semantics ONLY; never derived from compiler
# output. Document classes (band field) span the production domain mix:
#   BUSINESS  organizational/ownership/employment/leadership
#   TECH      products, technology, usage, implementation
#   SCIENCE   causation, influence, dependency, transformation
#   PEOPLE    roles, membership, authorship
#   GEO       locations
#   TIME      temporal events
#   CLASSIFY  classification/composition/alias
#   SCOPE     negation/conditional/question/speculative/hypothetical/
#             attributed assertion control
#   NO_REL    correct-abstention controls
#   PASSIVE   frozen syntactic direction evidence
#   OOV       triggers outside the manual vocabulary (honest
#             unsupported-rate measurement)
#
# Gold uses the frozen 28-predicate ontology vocabulary. Entities and
# evidence spans are the frozen upstream (the same convention as the
# Phase H corpora: upstream spans are byte-stable, no GLiNER variance).
#
# FREEZE: this file is immutable once scoring starts. Any later defect
# requires a new corpus version, never an edit.

version: "q1.0"
parent_control: "none (standalone heterogeneous qualification corpus)"

items:
  # ── BUSINESS ────────────────────────────────────────────────────────
  - id: q1_b01
    band: BUSINESS
    text: "AcmeCorp acquired the startup in March."
    entities: [{text: AcmeCorp, type: Organization}, {text: the startup, type: Organization}, {text: March, type: TimeReference}]
